name: Autonomous Vercel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-vercel:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_WuFioaYp4uYJTGTolfmlYnor
          vercel-project-id: prj_GJvoS7FJJAxD5HA93ai2sLWl55TA
          working-directory: ./admin-web
          vercel-args: '--prod'
